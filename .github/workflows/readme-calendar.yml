name: Update README calendar

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-calendar
  cancel-in-progress: true

jobs:
  calendar:
    if: github.repository == 'DDZmumo/PCL-Living-Fork'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate dual-theme calendar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs/assets/Generate-ReadmeCalendar.py --style pulse --output-dir "$RUNNER_TEMP/readme-calendar"
      - name: Publish generated calendars to their asset branch
        run: |
          set -euo pipefail
          branch=codex/readme-calendar
          # Main requires a PR and product checks. Generated images have a
          # separate append-only branch; the README keeps a local fallback.
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --orphan "$branch"
          fi
          mkdir -p docs/assets
          cp "$RUNNER_TEMP/readme-calendar/calendar-light.svg" docs/assets/calendar-light.svg
          cp "$RUNNER_TEMP/readme-calendar/calendar-dark.svg" docs/assets/calendar-dark.svg
          git add docs/assets/calendar-light.svg docs/assets/calendar-dark.svg
          if git diff --cached --quiet -- docs/assets/calendar-light.svg docs/assets/calendar-dark.svg; then
            echo "Calendar SVGs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh README release and commit calendar"
          git push origin "HEAD:refs/heads/$branch"
