name: Migration validation

on:
  push:
    branches: [main, migration/csharp-modern-dotnet]
  pull_request:
    branches: [main, migration/csharp-modern-dotnet]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select affected checks (manual dispatch runs all)
    runs-on: ubuntu-latest
    outputs:
      product_build: ${{ steps.scope.outputs.product_build }}
      migration_run: ${{ steps.scope.outputs.migration_run }}
      groups: ${{ steps.scope.outputs.groups }}
      windows_scripts: ${{ steps.scope.outputs.windows_scripts }}
      world_checks: ${{ steps.scope.outputs.world_checks }}
      engine_only: ${{ steps.scope.outputs.engine_only }}
      oracle: ${{ steps.scope.outputs.oracle }}
      inventory: ${{ steps.scope.outputs.inventory }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout selection source and diff history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed paths and known dependencies
        id: scope
        run: python3 scripts/Select-MigrationChecks.py --event-file "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" --report artifacts/migration/check-selection.json
      - name: Validate documentation-only changes
        if: steps.scope.outputs.docs_only == 'true'
        run: python3 scripts/Check-Documentation.py
      - name: Upload selected scope
        uses: actions/upload-artifact@v7
        with:
          name: migration-selected-checks
          path: artifacts/migration/check-selection.json
          if-no-files-found: error

  validate:
    needs: select
    # A selector-only push must not cancel an older real validation/artifact job.
    # Skipped jobs do not acquire this group; active matrix entries stay distinct.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'changes' }}-${{ matrix.os }}
      cancel-in-progress: true
    name: .NET 10 pure C# and inventory (${{ matrix.os }})
    if: needs.select.outputs.migration_run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout LF source and baseline history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate the fixed LF source inventory
        if: needs.select.outputs.inventory == 'true'
        run: python scripts/Inventory-Migration.py --ref f4aa0fae62c3ee8af24c81e61844c8fdd13c8983 --output artifacts/migration/source-inventory.baseline.json

      - name: Verify the committed inventory is reproducible
        if: needs.select.outputs.inventory == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = Path('docs/migration/source-inventory.baseline.json')
          actual = Path('artifacts/migration/source-inventory.baseline.json')
          if actual.read_text(encoding='utf-8') != expected.read_text(encoding='utf-8'):
              raise SystemExit('Source inventory differs from the committed LF baseline.')
          print('Source inventory matches the committed LF baseline.')
          PY

      - name: Initialize the fixed Shared dependency for migration tests and path comparison
        if: needs.select.outputs.groups != '[]' || (matrix.os == 'windows-latest' && needs.select.outputs.oracle == 'true')
        run: |
          git submodule update --init MeloongCore
          test "$(git -C MeloongCore rev-parse HEAD)" = c774ae4c85fd94e0eaa171db21e78a65870df19b

      - name: Run selected pure C# migration regressions on .NET 10
        if: needs.select.outputs.groups != '[]'
        env:
          MIGRATION_GROUPS: ${{ needs.select.outputs.groups }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          groups = json.loads(os.environ['MIGRATION_GROUPS'])
          if not groups or not all(isinstance(group, str) for group in groups):
              raise SystemExit('Empty or malformed selected test groups.')
          command = ['dotnet', 'run', '--project', 'tests/PCLLF.Migration.Tests/PCLLF.Migration.Tests.csproj', '--configuration', 'Release', '--']
          for group in groups:
              command.extend(['--group', group])
          print('Selected migration groups: ' + ', '.join(groups), flush=True)
          subprocess.run(command, check=True)
          PYTHON

      - name: Require fixed LF CLR4 and modern Windows resource I/O equivalence
        if: matrix.os == 'windows-latest' && needs.select.outputs.oracle == 'true'
        # Preserve the verified path cases and compare ZIP APIs with the independent LF-profile CLR4 process.
        shell: powershell
        run: ./scripts/Test-MigrationResourcePaths.ps1 -Mode RequireEquivalent -ReportPath artifacts/migration/resource-paths.json

      - name: Upload the Windows path comparison report
        if: always() && matrix.os == 'windows-latest' && needs.select.outputs.oracle == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: migration-resource-path-comparison-windows
          path: artifacts/migration/resource-paths.json
          if-no-files-found: warn

      - name: Upload the generated inventory
        if: always() && needs.select.outputs.inventory == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: migration-source-inventory-${{ matrix.os }}
          path: artifacts/migration/source-inventory.baseline.json
          if-no-files-found: error

  gate:
    name: Migration validation gate
    if: always()
    needs: [select, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require the actual selected validation result
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          VALIDATION_SELECTED: ${{ needs.select.outputs.migration_run }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: python scripts/Check-CiGate.py
