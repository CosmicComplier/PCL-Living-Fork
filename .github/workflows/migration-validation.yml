name: Migration validation

on:
  push:
    branches:
      - migration/csharp-modern-dotnet
    paths:
      - 'PCLCS/**'
      - 'Plain Craft Launcher 2/Modules/Minecraft/WorldMetadata.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/LocalGameData.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/PersonalGameSettings.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/InstanceKeybindings.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/QuickPlayWorlds.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/InstanceResourceStore.vb'
      - 'Plain Craft Launcher 2/Pages/PageInstance/PageInstanceKeybindings.xaml.vb'
      - 'tests/**'
      - 'scripts/Inventory-Migration.py'
      - 'scripts/Test-MigrationInventory.py'
      - 'scripts/Test-MigrationResourcePaths.ps1'
      - 'docs/migration/source-inventory.baseline.json'
      - '.github/workflows/migration-validation.yml'
  pull_request:
    branches:
      - migration/csharp-modern-dotnet
    paths:
      - 'PCLCS/**'
      - 'Plain Craft Launcher 2/Modules/Minecraft/WorldMetadata.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/LocalGameData.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/PersonalGameSettings.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/InstanceKeybindings.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/QuickPlayWorlds.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/InstanceResourceStore.vb'
      - 'Plain Craft Launcher 2/Pages/PageInstance/PageInstanceKeybindings.xaml.vb'
      - 'tests/**'
      - 'scripts/Inventory-Migration.py'
      - 'scripts/Test-MigrationInventory.py'
      - 'scripts/Test-MigrationResourcePaths.ps1'
      - 'docs/migration/source-inventory.baseline.json'
      - '.github/workflows/migration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: .NET 10 pure C# and inventory (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/migration/csharp-modern-dotnet'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout LF source and baseline history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate the fixed LF source inventory
        run: python scripts/Inventory-Migration.py --ref f4aa0fae62c3ee8af24c81e61844c8fdd13c8983 --output artifacts/migration/source-inventory.baseline.json

      - name: Verify the committed inventory is reproducible
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = Path('docs/migration/source-inventory.baseline.json')
          actual = Path('artifacts/migration/source-inventory.baseline.json')
          if actual.read_text(encoding='utf-8') != expected.read_text(encoding='utf-8'):
              raise SystemExit('Source inventory differs from the committed LF baseline.')
          print('Source inventory matches the committed LF baseline.')
          PY

      - name: Run pure C# migration regressions on .NET 10
        run: dotnet run --project tests/PCLLF.Migration.Tests/PCLLF.Migration.Tests.csproj --configuration Release

      - name: Initialize the fixed Shared dependency for Windows path comparison
        if: matrix.os == 'windows-latest'
        run: |
          git submodule update --init MeloongCore
          test "$(git -C MeloongCore rev-parse HEAD)" = c774ae4c85fd94e0eaa171db21e78a65870df19b

      - name: Compare fixed LF CLR4 and modern Windows paths (diagnostic)
        if: matrix.os == 'windows-latest'
        # Diagnostic reports differences; C007b2 must eliminate them before the equivalence gate closes.
        shell: powershell
        run: ./scripts/Test-MigrationResourcePaths.ps1 -Mode Diagnostic -ReportPath artifacts/migration/resource-paths.json

      - name: Upload the Windows path comparison report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: migration-resource-path-comparison-windows
          path: artifacts/migration/resource-paths.json
          if-no-files-found: warn

      - name: Upload the generated inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-source-inventory-${{ matrix.os }}
          path: artifacts/migration/source-inventory.baseline.json
          if-no-files-found: error
