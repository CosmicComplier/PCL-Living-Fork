name: Build

on:
  push:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENCE'
      - '!LICENSE'
      - '!NOTICE.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENCE'
      - '!LICENSE'
      - '!NOTICE.md'
  workflow_dispatch:
    inputs:
      native_product:
        description: Also run the actual CSharp native product workflow; historical comparison gates remain enabled.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  select:
    name: Select affected checks (manual dispatch runs all)
    runs-on: ubuntu-latest
    outputs:
      product_build: ${{ steps.scope.outputs.product_build }}
      migration_run: ${{ steps.scope.outputs.migration_run }}
      groups: ${{ steps.scope.outputs.groups }}
      windows_scripts: ${{ steps.scope.outputs.windows_scripts }}
      world_checks: ${{ steps.scope.outputs.world_checks }}
      engine_only: ${{ steps.scope.outputs.engine_only }}
      oracle: ${{ steps.scope.outputs.oracle }}
      inventory: ${{ steps.scope.outputs.inventory }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout selection source and diff history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed paths and known dependencies
        id: scope
        run: python3 scripts/Select-MigrationChecks.py --event-file "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" --report artifacts/migration/check-selection.json
      - name: Upload selected scope
        uses: actions/upload-artifact@v7
        with:
          name: product-selected-checks
          path: artifacts/migration/check-selection.json
          if-no-files-found: error

  build:
    needs: select
    # A selector-only push must not cancel an older real validation/artifact job.
    # Skipped jobs do not acquire this group; active matrix entries stay distinct.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'changes' }}-${{ matrix.configuration }}
      cancel-in-progress: true
    if: needs.select.outputs.product_build == 'true'
    name: Historical Main Windows consumer comparison
    runs-on: windows-latest
    env:
      MIGRATION_CHECKS: ${{ needs.select.outputs.windows_scripts }}
    strategy:  
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Verify fixed historical source inputs without a source checkout
      run: powershell -NoProfile -File scripts/tests/Test-FixedLfSource.ps1
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build the real historical comparison Main (not the Native product)
      id: product_build
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: |
        ./scripts/tests/Build-LegacyComparison.ps1 -Configuration ${{ matrix.configuration }} -ComparisonOnly
        $executables = @(Get-ChildItem -LiteralPath 'Plain Craft Launcher 2/bin' -Filter 'PCL-Living-Fork-*.exe')
        if ($executables.Count -ne 1) { throw 'Expected one versioned launcher executable' }
        "PCL_EXE=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify build credential protection
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: powershell -NoProfile -File scripts/Test-BuildCredentials.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify account migration and updater
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-Release')
      run: powershell -NoProfile -STA -File scripts/Test-Release.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify cancelled version scanning
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-VersionListCancellation')
      run: powershell -NoProfile -STA -File scripts/Test-VersionListCancellation.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify audit regressions
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-AuditFixes')
      run: powershell -NoProfile -STA -File scripts/Test-AuditFixes.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify launcher window activation
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-LauncherActivation')
      run: powershell -NoProfile -STA -File scripts/Test-LauncherActivation.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify toolbox operations
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-Toolbox')
      run: powershell -NoProfile -File scripts/Test-Toolbox.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify memory helper permissions in product and isolated source modes
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ToolboxMemory')
      run: |
        powershell -NoProfile -File scripts/Test-ToolboxMemory.ps1 -ExecutablePath "$env:PCL_EXE"
        if ($LASTEXITCODE -ne 0) { throw 'Product memory helper checks failed.' }
        powershell -NoProfile -File scripts/Test-ToolboxMemory.ps1
        if ($LASTEXITCODE -ne 0) { throw 'Isolated source memory helper checks failed.' }

    - name: Verify native game resource management
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-InstanceResources')
      run: powershell -NoProfile -STA -File scripts/Test-InstanceResources.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify map installation, resource recycle bin and global backgrounds
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-MapInstallAndRecycle') || contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-BackgroundModes')
      run: |
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-MapInstallAndRecycle') {
          powershell -NoProfile -STA -File scripts/Test-MapInstallAndRecycle.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Map installation and recycle bin checks failed' }
        }
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-BackgroundModes') {
          powershell -NoProfile -STA -File scripts/Test-BackgroundModes.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Global background checks failed' }
        }

    - name: Verify resource update compatibility and replacement
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ResourceUpdates')
      run: powershell -NoProfile -STA -File scripts/Test-ResourceUpdates.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify personal game settings and Quick Play
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-LocalGameFeatures')
      run: powershell -NoProfile -STA -File scripts/Test-LocalGameFeatures.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify first-run keybindings and Mojang Quick Play records
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-GameFeatureRegressions')
      run: powershell -NoProfile -STA -File scripts/Test-GameFeatureRegressions.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify modpack updates and personal changes
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ModpackUpdate') || contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ModpackUpdateUx')
      run: |
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-ModpackUpdate') {
          powershell -NoProfile -STA -File scripts/Test-ModpackUpdate.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Modpack update checks failed' }
        }
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-ModpackUpdateUx') {
          powershell -NoProfile -STA -File scripts/Test-ModpackUpdateUx.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Modpack update UI and download progress checks failed' }
        }

    - name: Verify file-operation cancellation, runtime recovery and redirect credentials
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ReviewFixes')
      run: powershell -NoProfile -STA -File scripts/Test-ReviewFixes.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify environment restore points
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-EnvironmentHistory') || contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-BackupRetention')
      run: |
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-EnvironmentHistory') {
          powershell -NoProfile -STA -File scripts/Test-EnvironmentHistory.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Environment restore checks failed' }
        }
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-BackupRetention') {
          powershell -NoProfile -STA -File scripts/Test-BackupRetention.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Backup retention and manual protection checks failed' }
        }

    - name: Verify recent-world card animation and launch sequencing
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-RecentWorldCard')
      run: powershell -NoProfile -STA -File scripts/Test-RecentWorldCard.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify launch dependency switches, confirmation and automatic repair
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-LaunchDependencies') || contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-DependencyActivation') || contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-DependencyToggles')
      run: |
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-LaunchDependencies') {
          powershell -NoProfile -STA -File scripts/Test-LaunchDependencies.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Launch dependency checks failed' }
        }
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-DependencyActivation') {
          powershell -NoProfile -STA -File scripts/Test-DependencyActivation.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency activation checks failed' }
        }
        if ((@(ConvertFrom-Json $env:MIGRATION_CHECKS)) -contains 'Test-DependencyToggles') {
          powershell -NoProfile -STA -File scripts/Test-DependencyToggles.ps1 -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency toggle checks failed' }
        }

    - name: Verify world protection, dependency checks, clones and resource regressions
      if: needs.select.outputs.world_checks == 'true'
      run: |
        $checks = @(
          'Test-WorldBackups', 'Test-WorldBackupGroups', 'Test-SaveBackupIntegration',
          'Test-ModDependencies', 'Test-ModDependencyOnline', 'Test-ModDependencyGraph',
          'Test-InstanceClone', 'Test-InstanceCloneGroups', 'Test-RecentEnvironmentChanges',
          'Test-EnvironmentCoverage', 'Test-KeybindingGroups',
          'Test-MapDetails', 'Test-ResourceEntryPoints', 'Test-WorldDetails', 'Test-ScreenshotGallery'
        )
        $selectedChecks = @(ConvertFrom-Json $env:MIGRATION_CHECKS)
        foreach ($check in $checks) {
          if ($selectedChecks -notcontains $check) { continue }
          powershell -NoProfile -STA -File "scripts/$check.ps1" -ExecutablePath "$env:PCL_EXE"
          if ($LASTEXITCODE -ne 0) { throw "$check failed" }
        }

    - name: Verify isolated backup engine migration adapters
      if: needs.select.outputs.engine_only == 'true' && (github.ref == 'refs/heads/migration/csharp-modern-dotnet' || github.base_ref == 'migration/csharp-modern-dotnet')
      run: |
        powershell -NoProfile -STA -File scripts/Test-WorldBackups.ps1 -EngineOnly
        if ($LASTEXITCODE -ne 0) { throw 'Isolated world backup engine checks failed' }

    - name: Verify custom download saves
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ToolboxDownload')
      run: powershell -NoProfile -File scripts/Test-ToolboxDownload.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify modpack mode
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ModpackMode')
      run: powershell -NoProfile -STA -File scripts/Test-ModpackMode.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify modpack folder isolation
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ModpackFolderScope')
      run: powershell -NoProfile -File scripts/Test-ModpackFolderScope.ps1

    - name: Verify shared version icons
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-IconCompatibility')
      run: powershell -NoProfile -STA -File scripts/Test-IconCompatibility.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify complete overview component loading
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-InstalledComponentLoading')
      run: powershell -NoProfile -STA -File scripts/Test-InstalledComponentLoading.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify exported version isolation
      if: contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-ExportVersionIsolation')
      run: powershell -NoProfile -STA -File scripts/Test-ExportVersionIsolation.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Build legacy update bridge
      run: ./scripts/Build-UpdateBridge.ps1 -ExecutablePath "$env:PCL_EXE" -OutputPath "Plain Craft Launcher 2\bin\legacy-update\LivingPCL.exe"

    - name: Verify update bridge handoff
      run: powershell -NoProfile -File scripts/Test-UpdateBridge.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Verify original custom-event DP owners XAML and safe secret boundaries
      if: ${{ !cancelled() && steps.product_build.outcome == 'success' && contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-CustomEventAndSecret') }}
      shell: pwsh
      run: |
        powershell -NoProfile -STA -File scripts/Test-CustomEventAndSecret.ps1 -ExecutablePath $env:PCL_EXE -RepositoryRoot $env:GITHUB_WORKSPACE
        if ($LASTEXITCODE -ne 0) { throw 'Original custom-event and secret boundary checks failed.' }

    - name: Verify migrated controls and isolated release resources
      if: ${{ !cancelled() && steps.product_build.outcome == 'success' && contains(fromJSON(needs.select.outputs.windows_scripts), 'Test-MigratedControls') }}
      run: powershell -NoProfile -STA -File scripts/Test-MigratedControls.ps1 -ExecutablePath "$env:PCL_EXE"

    - name: Retain the comparison-only full Main for original Windows consumers
      uses: actions/upload-artifact@v7
      with:
        name: LF-comparison-only ${{ matrix.configuration }} ${{ env.describe }}
        path: ${{ env.PCL_EXE }}

    - name: Retain comparison-only legacy bridge bytes
      uses: actions/upload-artifact@v7
      with:
        name: LF-comparison-only-legacy-update ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\bin\legacy-update\LivingPCL.exe

  native-product-preview:
    # The existing native-main push/PR workflow remains the automatic Native
    # product gate. This explicit manual path exercises the same graph once;
    # it never skips/replaces the historical consumer comparison above.
    name: Optional actual CSharp native product preview
    if: github.event_name == 'workflow_dispatch' && inputs.native_product && github.ref == 'refs/heads/migration/csharp-modern-dotnet'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-main.yml
