name: Build

on:
  push:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENCE'
      - '!LICENSE'
      - '!NOTICE.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENCE'
      - '!LICENSE'
      - '!NOTICE.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-product:
    # One canonical genuine Native build and complete original LF acceptance.
    name: LF CSharp NET10 WPF product and original consumer acceptance
    if: github.ref == 'refs/heads/migration/csharp-modern-dotnet' || (github.event_name == 'pull_request' && github.base_ref == 'migration/csharp-modern-dotnet')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-main.yml
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
