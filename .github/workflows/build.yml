name: Build

on:
  push:
    branches: [main, migration/csharp-modern-dotnet]
  pull_request:
    branches: [main, migration/csharp-modern-dotnet]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-product:
    # One canonical genuine Native build and complete original LF acceptance.
    name: LF CSharp NET10 WPF product and original consumer acceptance
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-main.yml
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
